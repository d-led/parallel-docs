name: ci

permissions:
  contents: read
  actions: write # e2e-static uploads the JUnit / Cypress artifact bundle

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
        package-manager: [npm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit (informational)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Quick CI
        run: bash scripts/quality-gate.sh

      - name: Integration tests
        run: npm run test:integration

      - name: Link-check static pages (lychee)
        run: |
          npm run pages:build
          bash scripts/linkcheck.sh
        if: ${{ always() }}

  # Cypress + static site (unprivileged). JUnit → GitHub Checks runs in e2e-publish-checks.yml (workflow_run, no PR SHA checkout).
  e2e-static:
    name: E2E static site
    needs: quick
    runs-on: ubuntu-latest
    container:
      # Pin to lockfile Cypress (package-lock: cypress@15.14.2). :latest can change
      # browsers/Cypress and produce nondeterministic or incompatible CI failures.
      image: cypress/included:15.14.2
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --progress=false

      - name: Build static site
        run: npm run pages:build

      - name: Validate Pages GitHub/blob + browse link shapes
        run: node scripts/validate-pages-github-links.mjs
        env:
          PARALLEL_DOCS_VALIDATE_PAGES_LIVE: "1"

      - name: Start static server
        run: |
          mkdir -p test-results
          nohup npm run e2e:server > /tmp/e2e-serve.log 2>&1 &
          echo $! > /tmp/e2e-serve.pid

      - name: Wait for server
        run: |
          n=0
          until node -e "require('http').get('http://127.0.0.1:14173/', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"; do
            n=$((n+1))
            [ "$n" -ge 60 ] && exit 1
            sleep 1
          done

      - name: Run E2E tests (with JUnit reporter)
        run: |
          npx cypress run --e2e --browser chrome --config-file cypress.config.ts --config baseUrl=http://127.0.0.1:14173
        env:
          CYPRESS_CI: true
          NODE_OPTIONS: --dns-result-order=ipv4first

      - name: Upload E2E bundle for Checks workflow
        # Keep artifacts on test failures, but skip during concurrency cancellations.
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-ci-bundle
          path: |
            test-results
            cypress/videos
            cypress/screenshots
