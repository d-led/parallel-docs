# Standalone `commentray` CLI (Node SEA) per OS/arch.
#
# - **Workflow artifacts** (`actions/upload-artifact`): short-lived by design
#   (`retention-days` below). Use them to debug a run or bridge jobs in this workflow only.
# - **GitHub Releases** (job `release` on `v*` tags): attaches standalone CLI binaries (all
#   targets), the packaged VS Code extension (`.vsix`), and release notes. Prefer Releases over
#   re-downloading expired workflow artifacts.
#
# npm packages are **not** published from Actions (maintainers publish locally with 2FA); see README / CONTRIBUTING.
name: binaries

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: binaries-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-15-intel
            target: darwin-x64
          - os: macos-14
            target: darwin-arm64
          - os: windows-2022
            target: windows-x64
    runs-on: ${{ matrix.os }}
    name: build-${{ matrix.target }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Use Node.js 22.x
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci

      - name: Build CLI bundle
        run: npm run build:bundle -w commentray

      - name: Build standalone binary
        shell: bash
        run: node scripts/build-binary.mjs

      - name: Smoke test binary
        shell: bash
        run: node scripts/smoke-binary.mjs

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: commentray-${{ matrix.target }}
          path: packages/cli/dist/bin/commentray-*
          if-no-files-found: error
          # Expire CI blobs automatically; tagged releases copy these into GitHub Release assets first.
          retention-days: 14

  vsix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Use Node.js 22.x
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci

      - name: Install VSIX packaging tools (icon rasterization)
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Package VS Code extension (.vsix)
        run: npm run extension:package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: commentray-vsix
          path: packages/vscode/dist/commentray-vscode-*.vsix
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [build, vsix]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Stage release attachments
        run: |
          mkdir -p release-binaries
          find artifacts -type f -name 'commentray-*' -exec cp -v {} release-binaries/ \;
          ls -lah release-binaries/

      - name: Create GitHub release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b  # v3.0.1
        with:
          files: release-binaries/*
          generate_release_notes: true

  # Pushes an updated binary-style `commentray.rb` to https://github.com/d-led/homebrew-d-led
  # (macOS + Linux only — matches the build matrix, excluding Windows). Requires
  # HOMEBREW_TAP_PUSH_TOKEN (see docs/development.md); the push script fails in CI if unset.
  update-homebrew-tap:
    needs: [release]
    if: github.repository == 'd-led/commentray' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Use Node.js 22.x
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22.x

      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_PUSH_TOKEN: ${{ secrets.HOMEBREW_TAP_PUSH_TOKEN }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: bash scripts/push-homebrew-tap.sh
